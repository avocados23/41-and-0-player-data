name: Player Data CI

on:
  pull_request:
  push:
    branches: [master, develop, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out player-data repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check pushed commit messages
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/validate_commit_message.py --range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Install Python dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --editable . --no-deps

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile package and jobs
        run: python -m compileall -q src scripts

      - name: Import pipeline modules
        run: >-
          python -c
          "import bracketballer_data.contextual_shooting,
          bracketballer_data.shooting_ability,
          scripts.compute.compute_shooting_ability_profiles,
          scripts.ingest.ingest_cbbd_shots_bulk"
